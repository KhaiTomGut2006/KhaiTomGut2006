<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tanawat Wongwad — Just a chill dev.</title>
  <desc id="desc">A dark navy developer banner with cream typography, orange accents, and a hand-drawn game controller. Games, web, and automation.</desc>
  <defs>
